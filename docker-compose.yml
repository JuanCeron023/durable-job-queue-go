services:
  tickflow:
    build: .
    ports:
      - "8081:8081"        # dashboard: http://localhost:8081
    volumes:
      - tickflow-data:/data # durable job journal survives restarts
    command: ["--http", ":8081", "--workers", "4", "--journal", "/data/tickflow.journal"]

volumes:
  tickflow-data:
